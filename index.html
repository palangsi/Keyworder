<!DOCTYPE html>
<html>
<head>
  <title>Sentence Cleaner Plus</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 40px auto; max-width: 700px; line-height: 1.6; color: #333; }
    textarea { width: 100%; height: 150px; resize: vertical; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    button { margin-top: 10px; padding: 10px 20px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    button:hover { background-color: #0056b3; }
    #output { background: #f4f4f9; border: 1px solid #ddd; }
    .status-msg { font-size: 0.85em; color: #28a745; margin-top: 5px; display: none; }
    #exceptions { margin-top: 20px; }
    #exceptions ul { list-style: none; padding: 0; }
    #exceptions li { margin: 4px 0; }
  </style>
</head>
<body>
  <h2>Sentence Cleaner Plus</h2>

  <h3>Input</h3>
  <textarea id="input" placeholder="Enter text here..."></textarea>
  <button id="convertBtn">Convert & Copy</button>
  <span id="copyStatus" class="status-msg">Copied to clipboard!</span>

  <h3>Output</h3>
  <textarea id="output" readonly></textarea>

  <div id="exceptions">
    <h3>Manage Exceptions</h3>
    <input type="text" id="newException" placeholder="Enter two or three words">
    <button id="addExceptionBtn">Add Exception</button>
    <button id="clearExceptionsBtn">Clear Saved Exceptions</button>
    <button id="downloadBtn">Download Exceptions</button>
    <input type="file" id="uploadInput" accept=".json" style="display:none">
    <button id="uploadBtn">Upload Exceptions</button>
    <ul id="exceptionList"></ul>
  </div>

  <script>
    let wordpairs = [];

    // Load defaults from JSON
    fetch('wordpairs.json')
      .then(r => r.json())
      .then(data => {
        wordpairs = data.exceptions || [];
        loadUserExceptions();
        renderExceptions();
      });

    function loadUserExceptions() {
      const stored = localStorage.getItem("userWordpairs");
      if (stored) {
        try {
          const userList = JSON.parse(stored);
          wordpairs = [...new Set([...wordpairs, ...userList])];
        } catch (e) {
          console.error("Error parsing stored exceptions:", e);
        }
      }
    }

    function saveUserExceptions() {
      localStorage.setItem("userWordpairs", JSON.stringify(wordpairs));
    }

    function renderExceptions() {
      const list = document.getElementById("exceptionList");
      list.innerHTML = "";
      wordpairs.forEach(pair => {
        const li = document.createElement("li");
        li.textContent = pair;
        list.appendChild(li);
      });
    }

    document.getElementById("addExceptionBtn").addEventListener("click", () => {
      const newEx = document.getElementById("newException").value.trim();
      if (newEx.split(" ").length >= 2 && newEx.length > 0) {
        wordpairs.push(newEx);
        wordpairs = [...new Set(wordpairs)];
        saveUserExceptions();
        renderExceptions();
        document.getElementById("newException").value = "";
      } else {
        alert("Please enter at least two words.");
      }
    });

    document.getElementById("clearExceptionsBtn").addEventListener("click", () => {
      localStorage.removeItem("userWordpairs");
      wordpairs = [];
      renderExceptions();
    });

    // Download exceptions as JSON
    document.getElementById("downloadBtn").addEventListener("click", () => {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({exceptions: wordpairs}, null, 2));
      const dlAnchor = document.createElement("a");
      dlAnchor.setAttribute("href", dataStr);
      dlAnchor.setAttribute("download", "my_exceptions.json");
      dlAnchor.click();
    });

    // Upload exceptions from JSON
    document.getElementById("uploadBtn").addEventListener("click", () => {
      document.getElementById("uploadInput").click();
    });

    document.getElementById("uploadInput").addEventListener("change", (event) => {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const userData = JSON.parse(e.target.result);
          if (userData.exceptions) {
            wordpairs = [...new Set([...wordpairs, ...userData.exceptions])];
            saveUserExceptions();
            renderExceptions();
          }
        } catch (err) {
          alert("Invalid JSON file.");
        }
      };
      reader.readAsText(file);
    });

    function cleanSentence(inputText) {
      if (!inputText.trim()) return "";
      let text = inputText;
      const sortedPairs = [...wordpairs].sort((a, b) => b.length - a.length);
      sortedPairs.forEach(pair => {
        const regex = new RegExp(pair, "gi");
        text = text.replace(regex, match => match.replace(/\s+/g, "___"));
      });
      let segments = text.split(/[\s,]+/);
      let cleaned = segments.map(s => s.trim()).filter(s => s.length >= 3);
      return cleaned.map(s => s.replace(/___/g, " ")).join(', ');
    }

    const btn = document.getElementById("convertBtn");
    const status = document.getElementById("copyStatus");

    btn.addEventListener("click", () => {
      const input = document.getElementById("input").value;
      const converted = cleanSentence(input);
      document.getElementById("output").value = converted;
      if (converted) {
        navigator.clipboard.writeText(converted).then(() => {
          status.style.display = "inline";
          setTimeout(() => { status.style.display = "none"; }, 2000);
        });
      }
    });
  </script>
</body>
</html>
