<!DOCTYPE html>
<html>
<head>
  <title>Sentence Cleaner Plus</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 40px auto; max-width: 700px; line-height: 1.6; color: #333; }
    textarea { width: 100%; height: 150px; resize: vertical; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    button { margin-top: 10px; padding: 10px 20px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    button:hover { background-color: #0056b3; }
    #output { background: #f4f4f9; border: 1px solid #ddd; }
    .status-msg { font-size: 0.85em; color: #28a745; margin-top: 5px; display: none; }
  </style>
</head>
<body>
  <h2>Sentence Cleaner Plus</h2>
  <p>Paste a sentence string below to clean and normalize your keywords.</p>
  <ul>
    <li>Removes short words (< 3 chars)</li>
    <li>Preserves specific phrases (e.g., "New York")</li>
    <li>Normalizes to <strong>comma + space</strong> separation</li>
  </ul>

  <h3>Input</h3>
  <textarea id="input" placeholder="Enter text here..."></textarea>
  <button id="convertBtn">Convert & Copy</button>
  <span id="copyStatus" class="status-msg">Copied to clipboard!</span>

  <h3>Output</h3>
  <textarea id="output" readonly></textarea>

  <script>
    // FIXED: Added missing commas and removed the trailing double comma
    const wordPairs = [
      "New York", "Los Angeles", "San Francisco", "Happy anniversary", "happy birthday",
      "happy valentine", "black background", "white background", "greeting card",
      "happy holidays", "happy new year", "happy mothers day", "happy fathers day",
      "easter bunny", "independence day", "lunar new year", "chinese new year",
      "saint patrick day", "labour day", "children's day", "merry christmas",
      "season greetings", "good friday", "easter sunday", "valentine's day",
      "wedding day", "baby shower", "bridal shower", "graduation day", "christmas eve",
      "christmas day", "thanksgiving day", "social media", "real estate", "high school",
      "middle school", "summer vacation", "winter holiday", "spring break", "autumn leaves",
      "golden hour", "blue sky", "full moon", "no people", "AI generated",
      "artificial intelligence", "young woman", "old woman", "young lady",
      "young family", "motion graphics", "10 seconds", "20 seconds", "big data", "information highway", "art deco"
    ];

    function cleanSentence(inputText) {
      if (!inputText.trim()) return "";

      let text = inputText;

      // 1. Protect word pairs by replacing spaces with a unique placeholder
      // We sort by length descending to ensure "Happy New Year" is caught before "New Year"
      const sortedPairs = [...wordPairs].sort((a, b) => b.length - a.length);
      
      sortedPairs.forEach(pair => {
        const regex = new RegExp(pair, "gi");
        text = text.replace(regex, match => match.replace(/\s+/g, "___"));
      });

      // 2. Split by commas OR spaces
      let segments = text.split(/[\s,]+/);

      // 3. Filter out items shorter than 3 chars and trim
      let cleaned = segments
        .map(s => s.trim())
        .filter(s => s.length >= 3);

      // 4. Restore the spaces in the protected phrases and join
      return cleaned.map(s => s.replace(/___/g, " ")).join(', ');
    }

    const btn = document.getElementById("convertBtn");
    const status = document.getElementById("copyStatus");

    btn.addEventListener("click", () => {
      const input = document.getElementById("input").value;
      const converted = cleanSentence(input);
      document.getElementById("output").value = converted;

      if (converted) {
        navigator.clipboard.writeText(converted).then(() => {
          status.style.display = "inline";
          setTimeout(() => { status.style.display = "none"; }, 2000);
        });
      }
    });
  </script>
</body>
</html>
