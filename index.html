<!DOCTYPE html>
<html>
<head>
  <title>Sentence Cleaner Plus</title>
  <style>
    body { font-family: sans-serif; margin: 20px; max-width: 700px; }
    textarea { width: 100%; height: 150px; resize: vertical; }
    button { margin-top: 10px; padding: 8px 12px; }
    #output { background: #f9f9f9; }
  </style>
</head>
<body>
  <h2>Sentence Cleaner Plus</h2>
  <p>Paste a sentence string below. It will:</p>
  <ul>
    <li>Remove extra spaces and commas</li>
    <li>Remove words shorter than 3 characters</li>
    <li>Preserve defined two-word phrases (no comma between them)</li>
    <li>Return a clean comma + space separated string</li>
  </ul>

  <h3>Input</h3>
  <textarea id="input"></textarea>
  <button id="convertBtn">Convert</button>

  <h3>Output</h3>
  <textarea id="output" readonly></textarea>

  <script>
    // Define word pairs that should stay together
    const wordPairs = [
      "New York","Los Angeles","San Francisco","Happy anniversary","happy birthday",
  "happy valentine","black background","white background","greeting card",
  "happy holidays","happy new year","happy mothers day","happy fathers day",
  "easter bunny","independence day","lunar new year","chinese new year",
  "saint patrick day","labour day","children's day","merry christmas",
  "season greetings","good friday","easter sunday","valentine's day",
  "wedding day","baby shower","bridal shower","graduation day","christmas eve",
  "christmas day","thanksgiving day","social media","real estate","high school",
  "middle school","summer vacation","winter holiday","spring break","autumn leaves",
  "golden hour","blue sky","full moon","no people","AI generated",
  "artificial intelligence","young woman","old woman","young lady",
      "young family","motion graphics", "10 seconds","20 seconds""big data","information highway",,
       ];

    function cleanSentence(inputText) {
      let text = inputText
        .trim()
        .replace(/\s+/g, ' ')   // collapse spaces
        .replace(/,+/g, ',')    // collapse commas
        .replace(/,\s*/g, ', ');// normalize comma spacing

      // Protect word pairs by replacing spaces with underscores temporarily
      wordPairs.forEach(pair => {
        const regex = new RegExp(pair, "gi");
        text = text.replace(regex, pair.replace(" ", "_"));
      });

      // Split into words by spaces or commas
      let words = text.split(/[\s,]+/)
        .map(w => w.trim())
        .filter(w => w.length >= 3); // remove short words

      // Restore word pairs
      words = words.map(w => w.replace("_", " "));

      return words.join(', ');
    }

    document.getElementById("convertBtn").addEventListener("click", () => {
      const input = document.getElementById("input").value;
      const converted = cleanSentence(input);
      document.getElementById("output").value = converted;

      navigator.clipboard.writeText(converted).then(() => {
        console.log("Cleaned string copied to clipboard!");
      });
    });
  </script>
</body>
</html>
